<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://nukwzrwigjyzakktxqtp.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Confirm a group dream · Wishtide</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Staff members of an organization answer a group dream's vouch here (link from the Wishtide email, see
     supabase/functions/group-checks). Buttons, not the link, send the answer, so email scanners that open links
     can't confirm by accident. Texts in English and Spanish live in vouch.js (?l=es picks Spanish). -->
<main class="legal vouch">
  <p class="vouch-top">
    <a href="./"><img src="favicon.png" alt="" width="36" height="36"> wishtide</a>
    <span class="vouch-lang">
      <button type="button" class="vouch-link" data-lang="en" lang="en">English</button> ·
      <button type="button" class="vouch-link" data-lang="es" lang="es">Español</button>
    </span>
  </p>
  <h1 id="title">Confirm a group dream</h1>
  <p id="intro"></p>
  <blockquote id="dream-card" class="vouch-card" hidden>
    <p id="dream-text" class="vouch-dream"></p>
    <p id="dream-meta" class="vouch-meta"></p>
  </blockquote>

  <!-- Step 1: do you know this person? -->
  <section id="step-ask" hidden>
    <h2 id="ask-q"></h2>
    <p class="vouch-buttons">
      <button id="ask-yes" type="button" class="cta" data-t="yesKnow"></button>
      <button id="ask-no" type="button" class="vouch-secondary" data-t="noKnow"></button>
    </p>
  </section>

  <!-- Step 2: the short form -->
  <section id="step-form" hidden>
    <fieldset class="vouch-field">
      <legend data-t="howLabel"></legend>
      <div id="how-options" class="vouch-options"></div>
      <input id="how-other" type="text" maxlength="80" hidden>
    </fieldset>
    <fieldset class="vouch-field">
      <legend data-t="longLabel"></legend>
      <div id="long-options" class="vouch-options"></div>
    </fieldset>
    <fieldset class="vouch-field">
      <legend data-t="realLabel"></legend>
      <div id="real-options" class="vouch-options"></div>
    </fieldset>
    <div class="vouch-field">
      <label for="note" data-t="noteLabel"></label>
      <textarea id="note" maxlength="500" rows="4"></textarea>
      <p id="note-count" class="vouch-meta"></p>
    </div>
    <p id="form-error" class="vouch-error" role="alert"></p>
    <p class="vouch-buttons">
      <button id="send" type="button" class="cta" data-t="send"></button>
      <button id="back" type="button" class="vouch-link" data-t="back"></button>
    </p>
  </section>

  <!-- Step 2b: "No, I don't know them" -->
  <section id="step-no" hidden>
    <p data-t="noIntro"></p>
    <div class="vouch-field">
      <label for="no-note" data-t="noteLabel"></label>
      <textarea id="no-note" maxlength="500" rows="4"></textarea>
    </div>
    <p id="no-error" class="vouch-error" role="alert"></p>
    <p class="vouch-buttons">
      <button id="send-no" type="button" class="cta" data-t="send"></button>
      <button id="back-no" type="button" class="vouch-link" data-t="back"></button>
    </p>
  </section>

  <!-- Step 3: thank you -->
  <section id="step-done" class="vouch-done" hidden tabindex="-1">
    <p class="vouch-heart" aria-hidden="true">💛</p>
    <h2 id="done-title"></h2>
    <p id="done-body"></p>
  </section>

  <p id="status" role="status"></p>
  <p class="vouch-meta" id="contact"></p>
</main>
<script src="vouch.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security: only our own files, Google Fonts, and the waiting-list endpoint may load. No inline code, no embedding forms elsewhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://nukwzrwigjyzakktxqtp.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wishtide · Coming soon</title>
<meta name="description" content="Wishtide · Make it real. Share a dream, others make it real. Coming soon. Join the waiting list.">
<meta property="og:title" content="Wishtide · Coming soon">
<meta property="og:description" content="Share a dream. Others make it real. Comparte un sueño. Otros lo hacen realidad.">
<meta name="theme-color" content="#1273b4">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<!-- Teaser only until launch (founder, 2026-11-15): no sample dreams, no product claims, just "Coming soon". -->
<body class="soon">
<main class="soon-main">
  <img class="soon-logo" src="logo-amanecer.png" alt="" width="180" height="180">
  <h1 class="soon-name">Wishtide</h1>
  <p class="soon-motto">MAKE IT REAL</p>
  <p class="soon-big">Share a dream.<br>Others make it real.</p>
  <p class="soon-small" lang="es">Comparte un sueño.<br>Otros lo hacen realidad.</p>
  <p class="soon-pill">Coming soon · Muy pronto</p>

  <form id="waitlist" class="soon-form" novalidate>
    <p class="soon-form-title">Join the waiting list <span lang="es">· Anótate en la lista de espera</span></p>
    <fieldset class="roles">
      <legend>I want to… · Quiero…</legend>
      <label><input type="radio" name="role" value="wishmaker" id="role-wishmaker" checked><span>Make dreams real</span></label>
      <label><input type="radio" name="role" value="dreamer" id="role-dreamer"><span>Share my dream</span></label>
    </fieldset>
    <label class="field">Email<input type="email" id="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
    <!-- Spam trap: hidden from people, bots fill it in. -->
    <div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
    <label class="field">First name (optional)<input type="text" id="first-name" name="firstName" autocomplete="given-name" maxlength="60"></label>
    <label class="field" id="dream-field" hidden>Your dream, in one sentence (optional)<textarea id="dream" name="dream" maxlength="300" placeholder="My dream is to…"></textarea></label>
    <button type="submit" id="submit">Join the waiting list</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<footer class="soon-footer">
  <span>© 2026 Wishtide · <a href="privacy.html">Privacy</a> · Instagram & TikTok <b>@wishtide.app</b></span>
</footer>

<script src="app.js" defer></script>
</body>
</html>
